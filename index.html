<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SM LIVE ZONE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#050510;
color:white;
font-family:'Rajdhani',sans-serif;
overflow:hidden;
}

.app{
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0a0f1f;
padding:10px;
overflow:auto;
border-right:1px solid #00eaff;
}

.logo{
font-family:'Orbitron';
text-align:center;
font-size:18px;
color:#00eaff;
margin-bottom:10px;
text-shadow:0 0 10px #00eaff;
}

/* SEARCH */
input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #00eaff;
background:#11182d;
color:white;
outline:none;
}

/* SECTION TITLE */
.title{
margin-top:10px;
margin-bottom:5px;
color:#00eaff;
font-size:14px;
opacity:0.9;
}

/* MENU */
.menu{
padding:10px;
margin:5px 0;
background:#11182d;
border-radius:10px;
cursor:pointer;
transition:.2s;
border:1px solid #1f2a4a;
}

.menu:hover{
background:#00eaff;
color:black;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
background:black;
padding:10px;
display:flex;
justify-content:center;
}

video{
width:100%;
max-width:900px;
aspect-ratio:16/9;
border-radius:10px;
border:1px solid #00eaff;
}

/* CHANNEL GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#11182d;
border:1px solid #1f2a4a;
padding:10px;
border-radius:10px;
cursor:pointer;
text-align:center;
transition:.2s;
}

.card:hover{
background:#00eaff;
color:black;
transform:scale(1.05);
}

/* MOBILE */
@media(max-width:700px){
.app{flex-direction:column}
.sidebar{width:100%;height:140px;display:flex;overflow-x:auto}
.menu{min-width:120px}
.grid{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">SM LIVE ZONE</div>

<input id="searchBox" placeholder="Search channel..." onkeyup="render()">

<div class="title">📺 CATEGORY</div>
<div class="menu" onclick="setFilter('sports')">🏆 Sports</div>
<div class="menu" onclick="setFilter('news')">📰 News</div>
<div class="menu" onclick="setFilter('kids')">🧸 Kids</div>
<div class="menu" onclick="setFilter('movies')">🎬 Movies</div>
<div class="menu" onclick="setFilter('music')">🎵 Music</div>

<div class="title">🌍 COUNTRY</div>
<div class="menu" onclick="setFilter('bangladesh')">🇧🇩 Bangladesh</div>
<div class="menu" onclick="setFilter('india')">🇮🇳 India</div>
<div class="menu" onclick="setFilter('global')">🌐 Global</div>

<div class="title">💥 LIVE GAME HUB</div>
<div class="menu" onclick="setFilter('live')">🏆 Live Sports Now</div>
<div class="menu" onclick="setFilter('football')">⚽ Football Live</div>
<div class="menu" onclick="setFilter('cricket')">🏏 Cricket Live</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div id="list" class="grid"></div>

</div>

</div>

<script>

/* SOURCES */
const sources = [
"https://iptv-org.github.io/iptv/index.m3u",
"https://iptv-org.github.io/iptv/countries/bd.m3u",
"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
];

let raw=[];
let channels=[];
let video=document.getElementById("video");
let hls;

function clean(n){
return (n||"")
.replace(/\[.*?\]/g,"")
.replace(/\(.*?\)/g,"")
.replace(/\|/g," ")
.replace(/\s+/g," ")
.trim();
}

function category(n){
n=n.toLowerCase();
if(n.includes("sport"))return "sports";
if(n.includes("news"))return "news";
if(n.includes("kids"))return "kids";
if(n.includes("movie"))return "movies";
if(n.includes("music"))return "music";
return "other";
}

function country(n){
n=n.toLowerCase();
if(n.includes("bangladesh")||n.includes("btv")||n.includes("somoy")||n.includes("atn"))return "bangladesh";
if(n.includes("india"))return "india";
return "global";
}

function isLive(c){
return c.category==="sports" || c.name.toLowerCase().includes("live");
}

function parse(data){

let name="";

data.split("\n").forEach(line=>{

line=line.trim();

if(line.startsWith("#EXTINF")){
name=clean(line.split(",")[1]);
}

if(line.startsWith("http")){
raw.push({
name:name||"Channel",
url:line,
category:category(name),
country:country(name),
live:isLive({name,category:category(name)}),
football:name.toLowerCase().includes("football"),
cricket:name.toLowerCase().includes("cricket")
});
}

});

}

async function loadAll(){

let done=0;

sources.forEach(url=>{

fetch(url)
.then(r=>r.text())
.then(parse)
.finally(()=>{

done++;
if(done===sources.length){
channels=raw;
render();
}

});

});

}

let current="all";

function setFilter(f){
current=f;
render();
}

function render(){

let box=document.getElementById("list");
box.innerHTML="";

let q=document.getElementById("searchBox").value.toLowerCase();

channels
.filter(c=>{

if(!c.name.toLowerCase().includes(q)) return false;

if(current==="all") return true;
if(current==="live") return c.live;
if(current==="football") return c.football;
if(current==="cricket") return c.cricket;

return c.category===current || c.country===current;

})
.forEach(c=>{

let d=document.createElement("div");
d.className="card";

d.innerHTML=`
${c.name}
<br>
<small>${c.category} | ${c.country}</small>
`;

d.onclick=()=>play(c.url);

box.appendChild(d);

});

}

function play(url){

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls({
enableWorker:false
});

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play();
});

}else{
video.src=url;
video.play();
}

}

loadAll();

</script>

</body>
</html>
