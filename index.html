<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SM LIVE ZONE</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
box-sizing:border-box;
font-family:'Rajdhani',sans-serif;
}

body{
margin:0;
height:100vh;
background:#050511;
color:white;
overflow:hidden;
}


.app{
height:100vh;
display:flex;
}


/* LEFT MENU */

.sidebar{

width:250px;
background:#0b1020;
padding:15px;
overflow:auto;
border-right:1px solid #00eaff;

}


.logo{

font-size:26px;
font-weight:bold;
color:#00eaff;
margin-bottom:20px;
text-align:center;

}


.menu{

background:#151b33;
margin:8px 0;
padding:10px;
border-radius:12px;
cursor:pointer;
transition:.2s;

}


.menu:hover,
.menu.active{

background:#00eaff;
color:#000;

}



/* MAIN */


.main{

flex:1;
display:flex;
flex-direction:column;
min-width:0;

}


.header{

height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
background:#080b18;

}


input,select{

background:#11182d;
color:white;
border:1px solid #00eaff;
padding:8px;
border-radius:10px;

}


.player{

background:black;
width:100%;
padding:10px;
display:flex;
justify-content:center;
position:relative;

}


video{

width:100%;
max-width:1000px;
aspect-ratio:16/9;
background:black;
border-radius:15px;

}


.buttons{

position:absolute;
right:20px;
top:20px;

}


button{

background:#00eaff;
border:0;
padding:8px 12px;
border-radius:10px;
cursor:pointer;

}



/* CHANNELS */


.channels{

flex:1;
overflow:auto;
padding:12px;

display:grid;
grid-template-columns:
repeat(auto-fill,minmax(170px,1fr));

gap:12px;

}



.card{

background:#11182d;
border:1px solid #24345c;
border-radius:15px;
padding:15px;
cursor:pointer;
text-align:center;

transition:.2s;

}


.card:hover{

transform:scale(1.05);
box-shadow:0 0 15px #00eaff;

}



small{
color:#8ff;
}



/* MOBILE */

@media(max-width:700px){

.app{
flex-direction:column;
}


.sidebar{

width:100%;
height:150px;
display:flex;
overflow-x:auto;

}


.menu{

min-width:130px;
height:45px;

}


.header{

height:auto;
flex-wrap:wrap;
gap:8px;

}


.player{

padding:5px;

}


.channels{

grid-template-columns:
repeat(2,1fr);

}

}


</style>

</head>


<body>


<div class="app">


<div class="sidebar">

<div class="logo">
🤖 SM LIVE ZONE
</div>


<div class="menu active" onclick="reset()">All</div>

<div class="menu" onclick="filter('category','sports')">
🏆 Sports
</div>

<div class="menu" onclick="filter('category','news')">
📰 News
</div>


<div class="menu" onclick="filter('category','kids')">
🧸 Kids
</div>


<div class="menu" onclick="filter('category','movies')">
🎬 Movies
</div>


<div class="menu" onclick="filter('worldcup','yes')">
🏆 World Cup
</div>


<div class="menu" onclick="filter('country','bangladesh')">
🇧🇩 Bangladesh
</div>


<div class="menu" onclick="filter('country','india')">
🇮🇳 India
</div>


<div class="menu" onclick="filter('language','bangla')">
বাংলা
</div>


<div class="menu" onclick="filter('language','hindi')">
हिन्दी
</div>


<div class="menu" onclick="filter('language','english')">
English
</div>


</div>



<div class="main">


<div class="header">


<input id="search"
placeholder="Search channel..."
onkeyup="render()">



<div>

<select id="country" onchange="advanced()">
<option value="">Country</option>
<option>bangladesh</option>
<option>india</option>
<option>global</option>
</select>


<select id="language" onchange="advanced()">
<option value="">Language</option>
<option>bangla</option>
<option>hindi</option>
<option>english</option>
</select>


<select id="category" onchange="advanced()">
<option value="">Category</option>
<option>sports</option>
<option>news</option>
<option>kids</option>
<option>movies</option>
</select>

</div>


</div>




<div class="player">


<video id="video" controls></video>


<div class="buttons">

<button onclick="small()">Mini</button>
<button onclick="full()">Full</button>

</div>


</div>



<div class="channels" id="list"></div>



</div>


</div>





<script>


const sources=[

"https://iptvflixbd.github.io/mrgifytv",

"https://iptv-org.github.io/iptv/index.m3u",

"https://raw.githubusercontent.com/FunctionError/PiratesTv/main/combined_playlist.m3u",

"https://raw.githubusercontent.com/FunctionError/PiratesTvPlus/main/PiratesPlus.m3u"

];


let channels=[];
let current=[];
let video=document.getElementById("video");
let hls;



function clean(n){

return n
.replace(/\[.*?\]/g,"")
.replace(/\(.*?\)/g,"")
.replace(/\|/g," ")
.replace(/\s+/g," ")
.trim();

}



function detectCategory(n){

n=n.toLowerCase();

if(n.includes("sport"))return "sports";
if(n.includes("news"))return "news";
if(n.includes("kids"))return "kids";
if(n.includes("movie"))return "movies";

return "other";

}



function detectCountry(n){

n=n.toLowerCase();


if(
n.includes("bd")||
n.includes("bangladesh")||
n.includes("btv")||
n.includes("somoy")||
n.includes("t sports")
)

return "bangladesh";


if(n.includes("india"))
return "india";


return "global";

}



function detectLanguage(n){

n=n.toLowerCase();


if(n.includes("bangla"))
return "bangla";


if(n.includes("hindi"))
return "hindi";


return "english";

}



function load(){


let done=0;


sources.forEach(url=>{


fetch(url)
.then(r=>r.text())
.then(parse)
.catch(()=>{})
.finally(()=>{


done++;

if(done==sources.length){


channels=unique(channels);


channels.sort((a,b)=>
a.country=="bangladesh"?-1:1
);


current=channels;

render();

}


});


});


}



function parse(data){


let name="";


data.split("\n").forEach(line=>{


line=line.trim();


if(line.startsWith("#EXTINF"))

name=clean(line.split(",")[1]);


if(line.startsWith("http")){


channels.push({

name:name||"Channel",

url:line,

category:detectCategory(name),

country:detectCountry(name),

language:detectLanguage(name),

worldcup:
detectCategory(name)=="sports"?"yes":"no"

});


}



});

}



function unique(arr){

let x={};

return arr.filter(c=>{

if(x[c.url])return false;

x[c.url]=1;

return true;

});

}




function render(){


let box=document.getElementById("list");

let s=document.getElementById("search").value.toLowerCase();


box.innerHTML="";


current
.filter(c=>c.name.toLowerCase().includes(s))
.forEach(c=>{


let d=document.createElement("div");


d.className="card";


d.innerHTML=

c.name+
"<br><small>"+
c.country+" | "+
c.language+" | "+
c.category+
"</small>";


d.onclick=()=>play(c.url);


box.appendChild(d);


});


}





function filter(k,v){


current=channels.filter(c=>c[k]==v);

render();

}



function advanced(){


let c=country.value;
let l=language.value;
let t=category.value;


current=channels.filter(x=>

(!c||x.country==c)&&
(!l||x.language==l)&&
(!t||x.category==t)

);


render();

}



function reset(){

current=channels;
render();

}



function play(url){


if(hls)
hls.destroy();


if(Hls.isSupported()){


hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);


hls.on(Hls.Events.MANIFEST_PARSED,()=>{

video.play();

});


}
else{

video.src=url;

}


}



function full(){

video.requestFullscreen();

}


function small(){

document.exitFullscreen();

}



load();


</script>


</body>
</html>
