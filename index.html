<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Live Zone</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

header{
background:#141414;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:#ff2d2d;
}

input{
padding:8px;
border-radius:20px;
border:none;
width:200px;
}

.container{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

.card{
background:#1c1c1c;
padding:10px;
border-radius:10px;
width:160px;
cursor:pointer;
text-align:center;
}

.card:hover{
background:#333;
}

video{
width:95%;
max-width:900px;
margin:15px auto;
display:block;
background:black;
border-radius:10px;
}
</style>

</head>

<body>

<header>
<div class="logo">📺 SM Live Zone</div>
<input type="text" placeholder="Search..." onkeyup="search(this.value)">
</header>

<video id="video" controls autoplay></video>

<div class="container" id="list">

<div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
News Test
</div>

<div class="card" onclick="play('https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8')">
Sports Test
</div>

<div class="card" onclick="play('https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">
Live Test
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");

function play(url){

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src = url;
}

}

function search(val){

let cards = document.querySelectorAll(".card");

cards.forEach(c=>{
if(c.innerText.toLowerCase().includes(val.toLowerCase())){
c.style.display="block";
}else{
c.style.display="none";
}
});

}

</script>

</body>
</html>
