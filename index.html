<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM LIVE ZONE ULTRA MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:radial-gradient(circle,#050510,#000,#02030a);
color:#fff;
font-family:'Rajdhani',sans-serif;
overflow:hidden;
}

.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0b1020;
padding:10px;
overflow:auto;
border-right:2px solid #00eaff;
}

.logo{
font-family:'Orbitron';
text-align:center;
color:#00eaff;
font-size:18px;
text-shadow:0 0 12px #00eaff;
margin-bottom:10px;
}

.menu{
padding:10px;
margin:5px 0;
background:#11182d;
border-radius:10px;
cursor:pointer;
transition:.2s;
border:1px solid #1f2a4a;
}

.menu:hover{
background:#00eaff;
color:#000;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

.top{
display:flex;
padding:8px;
background:#070a14;
gap:8px;
}

input{
flex:1;
padding:8px;
border-radius:8px;
border:1px solid #00eaff;
background:#111;
color:#fff;
}

/* PLAYER */
.player{
background:#000;
display:flex;
justify-content:center;
padding:6px;
border-bottom:1px solid #00eaff;
}

video{
width:100%;
max-width:900px;
border-radius:10px;
}

/* LIST */
.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#11182d;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f2a4a;
transition:.2s;
}

.card:hover{
background:#00eaff;
color:#000;
transform:scale(1.03);
}

.small{font-size:12px;opacity:0.8}

.star{
float:right;
cursor:pointer;
}

hr{border:0;border-top:1px solid #1f2a4a;margin:10px 0}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">SM LIVE ZONE</div>

<div class="menu" onclick="set('all')">📺 ALL</div>

<div class="menu" onclick="set('sports')">🏆 Sports</div>
<div class="menu" onclick="set('news')">📰 News</div>
<div class="menu" onclick="set('movies')">🎬 Movies</div>
<div class="menu" onclick="set('music')">🎵 Music</div>
<div class="menu" onclick="set('kids')">🧸 Kids</div>

<hr>

<div class="menu" onclick="set('bangladesh')">🇧🇩 Bangladesh</div>
<div class="menu" onclick="set('india')">🇮🇳 India</div>
<div class="menu" onclick="set('global')">🌍 Global</div>

<hr>

<div class="menu" onclick="set('bangla')">🗣️ Bangla</div>
<div class="menu" onclick="set('hindi')">🗣️ Hindi</div>
<div class="menu" onclick="set('english')">🗣️ English</div>

<hr>

<div class="menu" onclick="set('live')">🔴 Live TV</div>
<div class="menu" onclick="set('fav')">⭐ Favorites</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="top">
<input id="search" placeholder="Search channels..." onkeyup="render()">
</div>

<div class="player">
<video id="video" controls></video>
</div>

<div id="list" class="list"></div>

</div>

</div>

<script>

/* ================= ALL SOURCES (YOUR FULL LIST MERGED) ================= */
const sources = [
"https://iptvflixbd.github.io/mrgifytv",
"https://iptv-org.github.io/iptv/index.m3u",
"https://iptv-org.github.io/iptv/countries/bd.m3u",
"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",
"https://raw.githubusercontent.com/Shadmanislam/bdiptv/master/BD%20IPTV.m3u",
"https://lupael.github.io/IPTV/running.m3u",
"https://lupael.github.io/IPTV/world.m3u"
];

let raw=[];
let channels=[];
let hls;
let view="all";

/* FAVORITES */
let fav = JSON.parse(localStorage.getItem("fav")||"[]");

/* CLEAN */
function clean(n){
return (n||"")
.replace(/\[.*?\]/g,"")
.replace(/\(.*?\)/g,"")
.replace(/\|/g," ")
.replace(/\s+/g," ")
.trim();
}

/* DETECT CATEGORY */
function category(n){
n=n.toLowerCase();
if(n.includes("sport")) return "sports";
if(n.includes("news")) return "news";
if(n.includes("movie")) return "movies";
if(n.includes("music")) return "music";
if(n.includes("kids")) return "kids";
return "other";
}

/* COUNTRY */
function country(n){
n=n.toLowerCase();
if(n.includes("bangladesh")||n.includes("btv")||n.includes("somoy")) return "bangladesh";
if(n.includes("india")) return "india";
return "global";
}

/* LANGUAGE */
function language(n){
n=n.toLowerCase();
if(n.includes("bangla")) return "bangla";
if(n.includes("hindi")) return "hindi";
return "english";
}

/* LIVE */
function isLive(n){
return n.toLowerCase().includes("live") || n.toLowerCase().includes("sport");
}

/* PARSE M3U */
function parse(data){
let name="";
data.split("\n").forEach(l=>{
l=l.trim();

if(l.startsWith("#EXTINF")){
name=clean(l.split(",")[1]);
}

if(l.startsWith("http")){
raw.push({
name,
url:l,
category:category(name),
country:country(name),
language:language(name),
live:isLive(name)
});
}
});
}

/* LOAD ALL SOURCES */
async function load(){
for(let s of sources){
try{
let r=await fetch(s);
let t=await r.text();
parse(t);
}catch(e){}
}

/* REMOVE DUPLICATES */
let map={};
channels = raw.filter(c=>{
if(map[c.url]) return false;
map[c.url]=1;
return true;
});

render();
}
load();

/* FILTER */
function set(v){
view=v;
render();
}

/* FAVORITE */
function toggleFav(url){
if(fav.includes(url)){
fav=fav.filter(x=>x!==url);
}else{
fav.push(url);
}
localStorage.setItem("fav",JSON.stringify(fav));
render();
}

/* PLAY */
function play(url){
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

/* RENDER */
function render(){
let box=document.getElementById("list");
box.innerHTML="";

let q=document.getElementById("search").value.toLowerCase();

let list = channels.filter(c=>c.name.toLowerCase().includes(q));

/* FILTER ENGINE */
if(view==="sports") list=list.filter(c=>c.category==="sports");
else if(view==="news") list=list.filter(c=>c.category==="news");
else if(view==="movies") list=list.filter(c=>c.category==="movies");
else if(view==="music") list=list.filter(c=>c.category==="music");
else if(view==="kids") list=list.filter(c=>c.category==="kids");

else if(view==="bangladesh") list=list.filter(c=>c.country==="bangladesh");
else if(view==="india") list=list.filter(c=>c.country==="india");

else if(view==="bangla") list=list.filter(c=>c.language==="bangla");
else if(view==="hindi") list=list.filter(c=>c.language==="hindi");
else if(view==="english") list=list.filter(c=>c.language==="english");

else if(view==="live") list=list.filter(c=>c.live);
else if(view==="fav") list=list.filter(c=>fav.includes(c.url));

/* CARDS */
list.forEach(c=>{

let star = fav.includes(c.url) ? "⭐" : "☆";

let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<div onclick="play('${c.url}')">
<b>${c.name}</b>
<div class="small">${c.category} | ${c.country} | ${c.language}</div>
</div>
<div class="star" onclick="toggleFav('${c.url}')">${star}</div>
`;

box.appendChild(d);
});
}

</script>

</body>
</html>
