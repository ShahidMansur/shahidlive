<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPTV Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#080808;
color:white;
height:100vh;
overflow:hidden;

}


.container{

display:flex;
height:100vh;

}



/* SIDEBAR */

.sidebar{

width:300px;
background:#111;
border-right:1px solid #333;
display:flex;
flex-direction:column;

}


.logo{

height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:bold;
color:#00ff88;

}


.search{

margin:10px;
padding:12px;
border-radius:20px;
border:none;
outline:none;
background:#222;
color:white;

}



.channels{

overflow-y:auto;
flex:1;

}



.channel{

padding:15px;
cursor:pointer;
border-bottom:1px solid #222;
transition:.2s;

}


.channel:hover{

background:#222;

}



.channel.active{

background:#00ff88;
color:#000;

}





/* MAIN */

.main{

flex:1;
display:flex;
flex-direction:column;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
padding:20px;
font-size:18px;

}



.player{

flex:1;
background:#000;
display:flex;
align-items:center;
justify-content:center;

}



video{

width:100%;
height:100%;
background:black;

}



.loading{

font-size:20px;
color:#aaa;

}



@media(max-width:700px){


.sidebar{

width:200px;

}


.channel{

font-size:13px;

}


}


</style>

</head>




<body>


<div class="container">



<!-- CHANNEL AREA -->

<div class="sidebar">


<div class="logo">

🔥 IPTV

</div>



<input 
class="search"
id="search"
placeholder="Search channel..."
onkeyup="searchChannel()"
>



<div class="channels" id="channels">


<div class="loading">

Loading...

</div>


</div>


</div>






<!-- PLAYER AREA -->


<div class="main">


<div class="header" id="title">

Select Channel

</div>



<div class="player">


<video 
id="video"
controls
autoplay>

</video>


</div>


</div>



</div>







<script>


/*

PUT YOUR RAW M3U LINK HERE

Example:

https://raw.githubusercontent.com/user/repo/main/FIFA.m3u

*/


const M3U = 
"https://raw.githubusercontent.com/.../heads/main/FIFA.m3u";





let playlist=[];





async function loadM3U(){


try{


let response =
await fetch(M3U);



let text =
await response.text();




let lines =
text.split(/\r?\n/);




for(
let i=0;
i<lines.length;
i++
){



if(
lines[i].startsWith("#EXTINF")
){



let name =
lines[i]
.substring(
lines[i].lastIndexOf(",")+1
);



let url =
lines[i+1];




if(url){

playlist.push({

name:name,
url:url

});

}



}



}




displayChannels(playlist);



}

catch(e){


document.getElementById("channels")
.innerHTML =
"Failed to load playlist";


}



}








function displayChannels(list){


let box =
document.getElementById("channels");



box.innerHTML="";



list.forEach((item,index)=>{


let div =
document.createElement("div");



div.className="channel";



div.innerHTML =
"📺 "+item.name;



div.onclick=function(){



document
.querySelectorAll(".channel")
.forEach(x=>
x.classList.remove("active")
);



div.classList.add("active");



playStream(
item.url,
item.name
);



};




box.appendChild(div);



});



}







function playStream(url,name){



let video =
document.getElementById("video");



document.getElementById("title")
.innerHTML=name;





if(Hls.isSupported()){



let hls =
new Hls();



hls.loadSource(url);



hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

}

);



}

else{


video.src=url;

video.play();


}




}









function searchChannel(){



let text =
document
.getElementById("search")
.value
.toLowerCase();




let result =
playlist.filter(x=>

x.name
.toLowerCase()
.includes(text)

);



displayChannels(result);



}







loadM3U();



</script>



</body>

</html>
