<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U IPTV Player</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

header{
padding:10px;
background:#111;
text-align:center;
font-size:20px;
font-weight:bold;
}

video{
width:95%;
max-width:900px;
display:block;
margin:10px auto;
background:black;
border-radius:10px;
}

.container{
padding:10px;
}

.card{
background:#1a1a1a;
padding:10px;
margin:5px 0;
border-radius:8px;
cursor:pointer;
}

.card:hover{
background:#333;
}

</style>
</head>

<body>

<header>📺 M3U IPTV PLAYER</header>

<video id="video" controls autoplay></video>

<div class="container" id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let playlistUrl = "http://localhost:8000/TS-JioTV/app/tsjio_playlist.m3u";

let channels = [];

let video = document.getElementById("video");

// 🔥 LOAD M3U FILE
fetch(playlistUrl)
.then(res => res.text())
.then(data => {

let lines = data.split("\n");

let name = "";

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith("#EXTINF")){
name = lines[i].split(",")[1];
}

else if(lines[i].startsWith("http")){
channels.push({
name:name,
url:lines[i]
});
}
}

render();

});

function render(){

let list = document.getElementById("list");
list.innerHTML = "";

channels.forEach(ch => {

let div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<h3>${ch.name}</h3>
<p>${ch.url}</p>
`;

div.onclick = () => play(ch.url);

list.appendChild(div);

});

}

function play(url){

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src = url;
}

}

</script>

</body>
</html>
