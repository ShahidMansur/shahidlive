<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Live Zone - FINAL IPTV</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#111;
position:sticky;
top:0;
}

.logo{
font-size:20px;
font-weight:bold;
color:red;
}

.controls{
display:flex;
gap:8px;
align-items:center;
}

input, select{
padding:6px;
border-radius:6px;
border:none;
outline:none;
}

.player{
text-align:center;
padding:10px;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
background:black;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
padding:15px;
}

.card{
background:#1a1a1a;
padding:12px;
border-radius:10px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.card:hover{
background:#333;
transform:scale(1.05);
}

.badge{
font-size:12px;
color:#aaa;
}

</style>
</head>

<body>

<header>
<div class="logo">📺 SM LIVE ZONE</div>

<div class="controls">
<input id="search" placeholder="Search..." onkeyup="render()">

<select id="quality" onchange="play(currentChannel)">
<option value="auto">Auto</option>
<option value="360">360p</option>
<option value="720">720p</option>
<option value="1080">1080p</option>
</select>
</div>
</header>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");
let currentChannel = null;

const channels = [
{
name:"News HD",
type:"news",
streams:{
360:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
720:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
1080:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
},
{
name:"Sports HD",
type:"sports",
streams:{
360:"https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8",
720:"https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8",
1080:"https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"
}
},
{
name:"Movies HD",
type:"movies",
streams:{
360:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",
720:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",
1080:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"
}
}
];

function render(){

let list = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

list.innerHTML="";

channels
.filter(c => c.name.toLowerCase().includes(search))
.forEach((ch,i)=>{

let div = document.createElement("div");

div.className="card";

div.innerHTML=`
<h3>${ch.name}</h3>
<div class="badge">${ch.type}</div>
`;

div.onclick=()=> play(i);

list.appendChild(div);

});

}

function play(index){

currentChannel = index;

let quality = document.getElementById("quality").value;
let url = channels[index].streams[quality];

if(quality === "auto"){
url = channels[index].streams["720"];
}

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src = url;
}

}

render();

</script>

</body>
</html>
