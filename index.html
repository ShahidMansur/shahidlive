<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Live Zone - Shahid</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#141414;
position:sticky;
top:0;
}

.logo{
font-size:22px;
font-weight:bold;
color:#ff2d2d;
}

input{
padding:8px;
border-radius:20px;
border:none;
width:200px;
}

.categories{
display:flex;
gap:10px;
padding:10px;
overflow:auto;
}

.cat{
background:#222;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
}

.cat:hover{
background:#ff2d2d;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#1c1c1c;
padding:15px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
background:#333;
}

video{
width:95%;
max-width:900px;
display:block;
margin:15px auto;
background:black;
border-radius:10px;
}

img{
width:60px;
height:60px;
border-radius:50%;
}

</style>

</head>

<body>

<header>
<div class="logo">📺 SM Live Zone</div>

<input type="text" placeholder="Search..." onkeyup="search(this.value)">
</header>

<div class="categories">
<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('news')">News</div>
<div class="cat" onclick="filter('sports')">Sports</div>
<div class="cat" onclick="filter('movies')">Movies</div>
</div>

<video id="video" controls autoplay></video>

<div class="container" id="list">

<div class="card" data-type="news" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
<img src="https://via.placeholder.com/80?text=N">
<p>News Channel</p>
</div>

<div class="card" data-type="sports" onclick="play('https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8')">
<img src="https://via.placeholder.com/80?text=S">
<p>Sports Channel</p>
</div>

<div class="card" data-type="movies" onclick="play('https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">
<img src="https://via.placeholder.com/80?text=M">
<p>Movie Channel</p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");

function play(url){

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src = url;
}

}

// SEARCH
function search(val){
let cards=document.querySelectorAll(".card");
cards.forEach(c=>{
c.style.display =
c.innerText.toLowerCase().includes(val.toLowerCase())
? "block":"none";
});
}

// CATEGORY FILTER
function filter(type){

let cards=document.querySelectorAll(".card");

cards.forEach(c=>{
if(type=="all"){
c.style.display="block";
}
else{
c.style.display =
c.dataset.type==type ? "block":"none";
}
});

}

</script>

</body>
</html>
