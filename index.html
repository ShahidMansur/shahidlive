<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM LIVE ZONE ULTIMATE OTT 4.0</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#111;
padding:10px;
overflow-y:auto;
}

.logo{
color:red;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
border-radius:6px;
cursor:pointer;
}

.cat:hover{
background:red;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* TOP BAR */
.topbar{
padding:10px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
}

input{
padding:6px;
border-radius:6px;
border:none;
width:200px;
}

/* PLAYER */
.player{
height:45%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
background:black;
}

/* LIST (NETFLIX STYLE ROWS) */
.list{
height:55%;
overflow-y:auto;
padding:10px;
background:#0f0f0f;
}

.row{
margin-bottom:15px;
}

.row h3{
margin:5px 0;
color:#aaa;
}

.row-items{
display:flex;
gap:10px;
overflow-x:auto;
}

.card{
min-width:160px;
background:#1a1a1a;
padding:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.card:hover{
background:#333;
transform:scale(1.05);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 SM LIVE ZONE</div>

<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('news')">News</div>
<div class="cat" onclick="filter('sports')">Sports</div>
<div class="cat" onclick="filter('movies')">Movies</div>
<div class="cat" onclick="filter('kids')">Kids</div>
<div class="cat" onclick="filter('music')">Music</div>
<div class="cat" onclick="filter('religious')">Religious</div>
<div class="cat" onclick="filter('documentary')">Documentary</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input id="search" placeholder="Search channels..." onkeyup="render()">
<div>🔥 ULTIMATE OTT 4.0</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");

let allChannels = [];
let current = [];

// IPTV ORG MASTER LIST
let url = "https://iptv-org.github.io/iptv/index.m3u";

// 🔥 LOAD M3U
fetch(url)
.then(r=>r.text())
.then(data=>{

let lines = data.split("\n");
let name="";

lines.forEach(line=>{

line = line.trim();

if(line.startsWith("#EXTINF")){
name = line.split(",")[1] || "Unknown";
}

else if(line.startsWith("http")){
allChannels.push({
name:name,
url:line,
type:guessType(name)
});
}

});

current = allChannels.slice(0,600); // safe limit
render();

});

function guessType(name){

name = name.toLowerCase();

if(name.includes("news")) return "news";
if(name.includes("sport")) return "sports";
if(name.includes("movie")) return "movies";
if(name.includes("kids")) return "kids";
if(name.includes("music")) return "music";
if(name.includes("relig")) return "religious";
if(name.includes("doc")) return "documentary";

return "other";
}

function render(){

let list = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

list.innerHTML="";

let filtered = current.filter(c=>c.name.toLowerCase().includes(search));

// GROUP BY CATEGORY (Netflix style)
let groups = {};

filtered.forEach(ch=>{
if(!groups[ch.type]) groups[ch.type]=[];
groups[ch.type].push(ch);
});

for(let cat in groups){

let row = document.createElement("div");
row.className="row";

row.innerHTML = `<h3>${cat.toUpperCase()}</h3>`;

let rowItems = document.createElement("div");
rowItems.className="row-items";

groups[cat].slice(0,15).forEach(ch=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`${ch.name}`;

div.onclick=()=>play(ch.url);

rowItems.appendChild(div);

});

row.appendChild(rowItems);
list.appendChild(row);

}

}

function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src=url;
}

}

function filter(type){

if(type=="all"){
current = allChannels.slice(0,600);
}else{
current = allChannels.filter(c=>c.type==type);
}

render();

}

</script>

</body>
</html>
