<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM LIVE ZONE WORKING</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:200px;
background:#111;
padding:10px;
overflow-y:auto;
}

.logo{
color:red;
font-weight:bold;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
cursor:pointer;
border-radius:6px;
}
.cat:hover{background:red}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* TOP */
.topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
}

input{
padding:6px;
border-radius:6px;
border:none;
width:220px;
}

/* PLAYER */
.player{
height:45%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

video{
width:95%;
max-width:850px;
border-radius:10px;
}

/* LIST */
.list{
height:55%;
overflow-y:auto;
background:#0f0f0f;
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
}

.card{
background:#1a1a1a;
padding:10px;
border-radius:8px;
cursor:pointer;
text-align:center;
}
.card:hover{background:#333}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">📺 SM LIVE ZONE</div>

<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('news')">News</div>
<div class="cat" onclick="filter('sports')">Sports</div>
<div class="cat" onclick="filter('movies')">Movies</div>

</div>

<div class="main">

<div class="topbar">
<input id="search" placeholder="Search..." onkeyup="render()">
<div>LIVE FIX ✔</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video=document.getElementById("video");

let channels=[];

// 🔥 TRY REAL IPTV-ORG
fetch("https://iptv-org.github.io/iptv/index.m3u")
.then(r=>r.text())
.then(data=>{

let lines=data.split("\n");
let name="";

lines.forEach(l=>{

l=l.trim();

if(l.startsWith("#EXTINF")){
name=l.split(",")[1] || "Channel";
}

else if(l.startsWith("http")){
channels.push({
name:name,
url:l,
type:guess(name)
});
}

});

// if empty → fallback
if(channels.length===0){
loadFallback();
}else{
current=channels.slice(0,200);
render();
}

})
.catch(()=>{
loadFallback();
});

function loadFallback(){
channels=[
{name:"News HD",type:"news",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Sports Live",type:"sports",url:"https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"},
{name:"Movie Channel",type:"movies",url:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"}
];

current=channels;
render();
}

function guess(n){
n=n.toLowerCase();
if(n.includes("news"))return "news";
if(n.includes("sport"))return "sports";
if(n.includes("movie"))return "movies";
return "other";
}

let current=[];

function render(){

let list=document.getElementById("list");
let s=document.getElementById("search").value.toLowerCase();

list.innerHTML="";

current
.filter(c=>c.name.toLowerCase().includes(s))
.slice(0,200)
.forEach(ch=>{

let div=document.createElement("div");
div.className="card";
div.innerHTML=ch.name;

div.onclick=()=>play(ch.url);

list.appendChild(div);

});

}

function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}

}

function filter(t){

if(t=="all") current=channels;
else current=channels.filter(c=>c.type==t);

render();
}

</script>

</body>
</html>
