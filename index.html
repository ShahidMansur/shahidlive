<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD & Sports TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --primary: #2563eb;
            --accent: #ef4444;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }

        header {
            background-color: var(--panel);
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text); }
        .logo span { color: var(--accent); }

        .search-input {
            background: var(--bg); border: 1px solid #334155; padding: 10px 20px;
            border-radius: 20px; color: white; width: 100%; max-width: 300px; outline: none;
        }
        .search-input:focus { border-color: var(--primary); }

        .container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        
        @media (min-width: 992px) { .container { flex-direction: row; } }

        /* Video Section */
        .player-box {
            width: 100%;
            background: #000;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        @media (min-width: 992px) { .player-box { width: 60%; } }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        video { width: 100%; height: 100%; }

        .playing-info {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px;
            display: none; align-items: center; gap: 8px; font-size: 0.9rem; z-index: 10;
        }
        .red-dot { width: 10px; height: 10px; background: red; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Content Section */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Fixed Channel Bar - Wrap enabled so it never breaks */
        .category-bar {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: var(--panel);
            justify-content: center; border-bottom: 1px solid #334155;
        }

        .cat-btn {
            background: #334155; color: white; border: none; padding: 8px 20px;
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            transition: 0.2s;
        }
        .cat-btn:hover { background: #475569; }
        .cat-btn.active { background: var(--primary); }
        .cat-btn.fav { background: var(--accent); }

        /* Grid */
        .grid-wrap { flex: 1; padding: 15px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

        .card {
            background: var(--panel); border: 1px solid #334155; border-radius: 10px;
            padding: 15px 10px; text-align: center; cursor: pointer; position: relative;
            transition: 0.2s; height: 100px; display: flex; align-items: center; justify-content: center;
        }
        .card:hover { border-color: var(--primary); background: #283548; transform: translateY(-3px); }
        
        .card span { font-size: 0.85rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .fav-icon { position: absolute; top: 5px; right: 8px; color: #64748b; font-size: 1.2rem; cursor: pointer; }
        .fav-icon.active { color: var(--accent); }

        .message { text-align: center; padding: 20px; color: #94a3b8; grid-column: 1/-1; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BD<span>&</span>Sports</div>
        <input type="text" class="search-input" id="searchBox" placeholder="Search channel..." onkeyup="doSearch()">
    </header>

    <div class="container">
        <!-- Player -->
        <div class="player-box">
            <div class="video-wrapper">
                <div class="playing-info" id="playInfo">
                    <div class="red-dot"></div>
                    <span id="chName">Loading...</span>
                </div>
                <video id="vidPlayer" controls autoplay></video>
            </div>
        </div>

        <!-- Channels -->
        <div class="content">
            <!-- Simple & Fixed Category Bar -->
            <div class="category-bar">
                <button class="cat-btn active" onclick="setCat('All')">📺 All</button>
                <button class="cat-btn" onclick="setCat('Bangladesh')">🇧🇩 BD Channels</button>
                <button class="cat-btn" onclick="setCat('Sports')">🏆 World Sports</button>
                <button class="cat-btn fav" onclick="setCat('Fav')">❤️ Fav</button>
            </div>

            <div class="grid-wrap">
                <div class="grid" id="mainGrid">
                    <div class="message">Filtering only BD & Sports channels... Please wait.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('vidPlayer');
        const grid = document.getElementById('mainGrid');
        const playInfo = document.getElementById('playInfo');
        const chNameText = document.getElementById('chName');
        let hls;

        let myChannels = [];
        let curCat = 'All';
        let searchTxt = '';
        let favs = JSON.parse(localStorage.getItem('myFavs')) || [];

        // Manual Links (Only BD & Sports)
        const manual = [
            { name: "T Sports HD", url: "https://live-cdn.tsports.com/live-01/index.m3u8", type: "bd,sports" },
            { name: "GTV (Gazi TV)", url: "https://rhridoy136.shortcm.li/gtv.m3u8", type: "bd,sports" },
            { name: "BTV World", url: "https://rhridoy136.shortcm.li/btvworld.m3u8", type: "bd" },
            { name: "Somoy TV", url: "https://rhridoy136.shortcm.li/shomoytv.m3u8", type: "bd" },
            { name: "Jamuna TV", url: "https://rhridoy136.shortcm.li/jamunatv.m3u8", type: "bd" },
            { name: "Channel 24", url: "https://rhridoy136.shortcm.li/channel24.m3u8", type: "bd" },
            { name: "Independent TV", url: "https://rhridoy136.shortcm.li/independenttv.m3u8", type: "bd" },
            { name: "ATN News", url: "https://rhridoy136.shortcm.li/atnnews.m3u8", type: "bd" },
            { name: "ATN Bangla", url: "http://103.205.133.19/hls/atnbangla.m3u8", type: "bd" },
            { name: "Channel 9", url: "https://rhridoy136.shortcm.li/channel9.m3u8", type: "bd,sports" },
            { name: "ESPN 2 Global", url: "https://gma2.blab.email/espn2.m3u8", type: "sports" },
            { name: "ESPN U", url: "https://gma2.blab.email/espnu.m3u8", type: "sports" }
        ];

        const sources = [
            "https://raw.githubusercontent.com/Shadmanislam/bdiptv/master/BD%20IPTV.m3u",
            "https://github.com/abusaeeidx/Mrgify-BDIX-IPTV/raw/main/playlist.m3u",
            "https://iptv-org.github.io/iptv/countries/bd.m3u",
            "https://iptv-org.github.io/iptv/index.m3u",
            "https://raw.githubusercontent.com/FunctionError/PiratesTv/main/combined_playlist.m3u"
        ];

        async function start() {
            manual.forEach(c => myChannels.push({ name: c.name, url: c.url, type: c.type }));
            showData();

            let fetchJobs = sources.map(u => fetch(u).then(r => r.ok ? r.text() : '').then(txt => parseM3U(txt)).catch(e=>console.log(e)));
            await Promise.allSettled(fetchJobs);
            
            cleanDuplicates();
            showData();

            if(myChannels.length > 0) play(myChannels[0].url, myChannels[0].name);
        }

        function parseM3U(txt) {
            if(!txt) return;
            let lines = txt.split('\n');
            let tempName = '', tempType = '';

            for(let i=0; i<lines.length; i++) {
                let ln = lines[i].trim();
                if(ln.startsWith('#EXTINF:')) {
                    tempName = ln.split(',').pop().replace(/\[.*?\]|\(.*?\)|[-_]/g, ' ').replace(/1080p|720p|HD|SD|FHD/gi, '').trim();
                    let lowLine = ln.toLowerCase();
                    
                    let isBD = lowLine.includes('bangladesh') || lowLine.includes('bd') || lowLine.includes('bangla');
                    let isSport = lowLine.includes('sport') || lowLine.includes('espn') || lowLine.includes('fifa') || lowLine.includes('cricket') || lowLine.includes('football') || lowLine.includes('game') || lowLine.includes('star');

                    // ONLY KEEP BD OR SPORTS
                    if(isBD && isSport) tempType = 'bd,sports';
                    else if(isBD) tempType = 'bd';
                    else if(isSport) tempType = 'sports';
                    else tempType = 'skip'; // Skip everything else

                } else if(ln.startsWith('http') && tempType !== 'skip' && tempName) {
                    myChannels.push({ name: tempName, url: ln, type: tempType });
                    tempName = ''; tempType = '';
                }
            }
        }

        function cleanDuplicates() {
            let unique = new Map();
            myChannels.forEach(c => {
                let k = c.name.toLowerCase();
                if(!unique.has(k) && !unique.has(c.url)) {
                    unique.set(k, c);
                    unique.set(c.url, c);
                }
            });
            myChannels = Array.from(new Set(unique.values())).sort((a,b) => {
                if(a.type.includes('bd') && !b.type.includes('bd')) return -1;
                return a.name.localeCompare(b.name);
            });
        }

        window.setCat = function(c) {
            curCat = c;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            showData();
        }

        window.doSearch = function() {
            searchTxt = document.getElementById('searchBox').value.toLowerCase();
            showData();
        }

        window.toggleFav = function(e, u) {
            e.stopPropagation();
            if(favs.includes(u)) favs = favs.filter(f => f !== u);
            else favs.push(u);
            localStorage.setItem('myFavs', JSON.stringify(favs));
            showData();
        }

        function showData() {
            grid.innerHTML = '';
            let list = myChannels;

            if(searchTxt) list = list.filter(c => c.name.toLowerCase().includes(searchTxt));
            else if(curCat === 'Fav') list = list.filter(c => favs.includes(c.url));
            else if(curCat === 'Bangladesh') list = list.filter(c => c.type.includes('bd'));
            else if(curCat === 'Sports') list = list.filter(c => c.type.includes('sports'));

            if(list.length === 0) {
                grid.innerHTML = `<div class="message">No channels found.</div>`;
                return;
            }

            list.forEach(c => {
                let isF = favs.includes(c.url);
                grid.innerHTML += `
                    <div class="card" onclick="play('${c.url}', '${c.name.replace(/'/g, "\\'")}')">
                        <div class="fav-icon ${isF ? 'active' : ''}" onclick="toggleFav(event, '${c.url}')">♥</div>
                        <span>${c.name}</span>
                    </div>
                `;
            });
        }

        window.play = function(u, n) {
            playInfo.style.display = 'flex';
            chNameText.innerText = n;
            
            if(hls) hls.destroy();

            if(Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(u);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e=>console.log(e)));
            } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = u;
                video.addEventListener('loadedmetadata', () => video.play());
            }
            if(window.innerWidth < 992) window.scrollTo({top:0, behavior:'smooth'});
        }

        start();
    </script>
</body>
</html>
