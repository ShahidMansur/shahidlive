<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM LIVE ZONE - IPTV ORG</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#111;
padding:10px;
overflow-y:auto;
}

.logo{
color:red;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
border-radius:6px;
cursor:pointer;
}

.cat:hover{
background:red;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.top{
padding:10px;
background:#111;
display:flex;
justify-content:space-between;
}

input{
padding:6px;
border-radius:6px;
border:none;
width:200px;
}

/* PLAYER */
.player{
height:45%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
background:black;
}

/* LIST */
.list{
height:55%;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
padding:10px;
background:#0f0f0f;
}

.card{
background:#1a1a1a;
padding:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.card:hover{
background:#333;
transform:scale(1.05);
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">📺 SM LIVE ZONE</div>

<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('news')">News</div>
<div class="cat" onclick="filter('sports')">Sports</div>
<div class="cat" onclick="filter('movies')">Movies</div>
<div class="cat" onclick="filter('kids')">Kids</div>
<div class="cat" onclick="filter('music')">Music</div>
<div class="cat" onclick="filter('religious')">Religious</div>
<div class="cat" onclick="filter('documentary')">Documentary</div>

</div>

<div class="main">

<div class="top">
<input id="search" placeholder="Search..." onkeyup="render()">
<div>IPTV-ORG LIVE</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");

let all = [];
let current = [];

let url = "https://iptv-org.github.io/iptv/index.m3u";

// 🔥 LOAD IPTV-ORG MASTER LIST
fetch(url)
.then(r=>r.text())
.then(data=>{

let lines = data.split("\n");
let name="";

lines.forEach(line=>{

line = line.trim();

if(line.startsWith("#EXTINF")){
name = line.split(",")[1] || "Unknown";
}

else if(line.startsWith("http")){
all.push({
name:name,
url:line,
type:guessType(name)
});
}

});

current = all.slice(0,500); // 🔥 limit for speed
render();

});

function guessType(name){

name = name.toLowerCase();

if(name.includes("news")) return "news";
if(name.includes("sport")) return "sports";
if(name.includes("movie")) return "movies";
if(name.includes("kids")) return "kids";
if(name.includes("music")) return "music";
if(name.includes("relig")) return "religious";
if(name.includes("doc")) return "documentary";

return "other";
}

function render(){

let list=document.getElementById("list");
let search=document.getElementById("search").value.toLowerCase();

list.innerHTML="";

current
.filter(c=>c.name.toLowerCase().includes(search))
.slice(0,200)
.forEach(ch=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${ch.name}</b><br>
<small>${ch.type}</small>
`;

div.onclick=()=>play(ch.url);

list.appendChild(div);

});

}

function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src=url;
}

}

function filter(type){

if(type=="all"){
current=all;
}else{
current=all.filter(c=>c.type==type);
}

render();

}

</script>

</body>
