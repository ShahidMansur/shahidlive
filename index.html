<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SM LIVE ZONE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
background:#050510;
color:white;
font-family:'Rajdhani',sans-serif;
overflow:hidden;
}


.app{
height:100vh;
display:flex;
}


.sidebar{

width:260px;
background:#080d1c;
padding:12px;
overflow:auto;
border-right:2px solid #00eaff;

}


.logo{

font-family:'Orbitron';
font-size:20px;
text-align:center;
color:#00eaff;
margin-bottom:15px;

}


input{

width:100%;
padding:10px;
background:#11182d;
color:white;
border:1px solid #00eaff;
border-radius:10px;

}


.title{

margin-top:15px;
color:#00eaff;

}



.menu{

background:#11182d;
padding:10px;
margin:6px 0;
border-radius:12px;
cursor:pointer;

}


.menu:hover{

background:#00eaff;
color:black;

}



.main{

flex:1;
display:flex;
flex-direction:column;
min-width:0;

}



.player{

height:42vh;
background:black;
display:flex;
align-items:center;
justify-content:center;
position:relative;

}



video{

width:90%;
height:100%;
object-fit:contain;

}



.full{

position:absolute;
right:15px;
bottom:15px;
background:#00eaff;
border:0;
border-radius:50%;
width:40px;
height:40px;

}



.list{

flex:1;
overflow:auto;
padding:12px;

display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:12px;

}



.card{

background:#11182d;
border-radius:15px;
padding:15px;
cursor:pointer;
text-align:center;
border:1px solid #223;

}


.card:hover{

background:#00eaff;
color:black;

}



small{
opacity:.8;
}



@media(max-width:700px){

.app{
flex-direction:column;
}


.sidebar{

width:100%;
height:220px;

}


.player{

height:35vh;

}


.list{

grid-template-columns:repeat(2,1fr);

}

}

</style>


</head>


<body>



<div class="app">



<div class="sidebar">


<div class="logo">
🤖 SM LIVE ZONE
</div>



<input id="search"
placeholder="Search channel..."
onkeyup="render()">





<div class="title">📺 CATEGORY</div>


<div class="menu" onclick="filter('sports')">
🏆 Sports
</div>


<div class="menu" onclick="filter('news')">
📰 News
</div>


<div class="menu" onclick="filter('kids')">
🧸 Kids
</div>


<div class="menu" onclick="filter('movies')">
🎬 Movies
</div>


<div class="menu" onclick="filter('music')">
🎵 Music
</div>





<div class="title">🌍 COUNTRY</div>


<div class="menu" onclick="filter('bangladesh')">
🇧🇩 Bangladesh
</div>


<div class="menu" onclick="filter('india')">
🇮🇳 India
</div>


<div class="menu" onclick="filter('global')">
🌐 Global
</div>






<div class="title">💥 LIVE GAME HUB</div>


<div class="menu" onclick="filter('worldcup')">
🏆 World Cup Live
</div>


<div class="menu" onclick="filter('live')">
⚽ Live Sports Now
</div>


<div class="menu" onclick="filter('football')">
⚽ Football Live
</div>


<div class="menu" onclick="filter('cricket')">
🏏 Cricket Live
</div>


<div class="menu" onclick="filter('fav')">
⭐ Favorites
</div>




</div>





<div class="main">



<div class="player">

<video id="video" controls></video>

<button class="full"
onclick="fullscreen()">
⛶
</button>

</div>


<div id="list" class="list"></div>


</div>


</div>







<script>


const sources=[


"https://iptv-org.github.io/iptv/index.m3u",

"https://iptv-org.github.io/iptv/countries/bd.m3u",

"https://raw.githubusercontent.com/Shadmanislam/bdiptv/master/BD%20IPTV.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"

];



let channels=[];

let current="all";

let video=document.getElementById("video");

let hls;



let fav=
JSON.parse(localStorage.fav||"[]");





function clean(x){

return (x||"")
.replace(/\[.*?\]/g,"")
.replace(/\(.*?\)/g,"")
.replace(/\|/g," ")
.replace(/\s+/g," ")
.trim();

}




function getCat(n){

n=n.toLowerCase();


if(n.includes("sport"))
return "sports";


if(n.includes("news"))
return "news";


if(n.includes("movie"))
return "movies";


if(n.includes("kid"))
return "kids";


if(n.includes("music"))
return "music";


return "other";

}





function getCountry(n){

n=n.toLowerCase();


if(
n.includes("bd")||
n.includes("bangladesh")||
n.includes("btv")||
n.includes("somoy")||
n.includes("t sport")
)

return "bangladesh";



if(n.includes("india"))
return "india";


return "global";

}






function parse(text){


let name="";


text.split("\n")
.forEach(line=>{


line=line.trim();



if(line.startsWith("#EXTINF"))

name=clean(
line.split(",")[1]
);




if(line.startsWith("http")){


let low=name.toLowerCase();



channels.push({

name:name||"Channel",

url:line,

cat:getCat(name),

country:getCountry(name),


live:getCat(name)=="sports",


football:
low.includes("football") ||
low.includes("soccer"),



cricket:
low.includes("cricket"),



worldcup:
(
low.includes("world cup") ||
low.includes("fifa") ||
low.includes("football") ||
low.includes("soccer") ||
low.includes("t sport") ||
low.includes("tsports")
)


});


}



});

}





async function load(){



for(let s of sources){


try{


let r=await fetch(s);

let t=await r.text();

parse(t);



}catch(e){}



}




let map={};



channels.forEach(c=>{


let key=c.name.toLowerCase();



if(!map[key])

map[key]=c;



});



channels=Object.values(map);



channels.sort((a,b)=>{


if(a.country=="bangladesh")
return -1;


return 1;


});



render();


}






function filter(x){

current=x;

render();

}






function render(){


let box=document.getElementById("list");

box.innerHTML="";



let q=
document.getElementById("search")
.value.toLowerCase();





channels
.filter(c=>{



if(!c.name.toLowerCase().includes(q))
return false;



if(current=="all")
return true;



if(current=="live")
return c.live;



if(current=="football")
return c.football;



if(current=="cricket")
return c.cricket;



if(current=="worldcup")
return c.worldcup;



if(current=="fav")
return fav.includes(c.url);




return (
c.cat==current ||
c.country==current
);



})

.forEach(c=>{



let d=document.createElement("div");


d.className="card";



d.innerHTML=

c.name+
"<br><small>"+
c.country+
" | "+
c.cat+
"</small>";



d.onclick=()=>play(c);



box.appendChild(d);



});



}





function play(c){



if(hls)

hls.destroy();




if(Hls.isSupported()){



hls=new Hls();


hls.loadSource(c.url);


hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{
video.play();
}
);



}

else{


video.src=c.url;
video.play();


}



}





function fullscreen(){


video.requestFullscreen();


}




load();



</script>


</body>
</html>
