<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM LIVE ZONE PRO IPTV</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
display:flex;
font-family:Arial;
background:#000;
color:#fff;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#111;
padding:10px;
overflow-y:auto;
flex-shrink:0;
}

.logo{
color:red;
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
border-radius:6px;
cursor:pointer;
font-size:13px;
}
.cat:hover{background:red}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

/* TOP */
.topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
}

input{
padding:6px;
border:none;
border-radius:6px;
width:220px;
}

/* PLAYER */
.player{
height:42%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:95%;
max-width:900px;
aspect-ratio:16/9;
border-radius:10px;
}

/* LIST */
.list{
height:58%;
overflow-y:auto;
background:#0f0f0f;
padding:10px;

display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:10px;
}

.card{
background:#1a1a1a;
padding:10px;
border-radius:8px;
cursor:pointer;
text-align:center;
font-size:12px;
transition:0.2s;
}

.card:hover{
background:#333;
transform:scale(1.03);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 SM LIVE ZONE PRO</div>

<h4>📂 Category</h4>
<div class="cat" onclick="setFilter('category','all')">All</div>
<div class="cat" onclick="setFilter('category','news')">News</div>
<div class="cat" onclick="setFilter('category','sports')">Sports</div>
<div class="cat" onclick="setFilter('category','movies')">Movies</div>
<div class="cat" onclick="setFilter('category','kids')">Kids</div>
<div class="cat" onclick="setFilter('category','music')">Music</div>

<h4>🌐 Language</h4>
<div class="cat" onclick="setFilter('language','bangla')">Bangla</div>
<div class="cat" onclick="setFilter('language','hindi')">Hindi</div>
<div class="cat" onclick="setFilter('language','english')">English</div>

<h4>🌍 Country</h4>
<div class="cat" onclick="setFilter('country','bangladesh')">Bangladesh</div>
<div class="cat" onclick="setFilter('country','india')">India</div>
<div class="cat" onclick="setFilter('country','global')">Global</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input id="search" placeholder="Search channels..." onkeyup="render()">
<div>PRO IPTV ✔</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video=document.getElementById("video");

let rawChannels=[];

// SAMPLE + REAL MERGE SAFE (replace with your sources)
let sources=[
"https://iptv-org.github.io/iptv/index.m3u",
"https://iptvflixbd.github.io/mrgifytv",
"https://raw.githubusercontent.com/FunctionError/PiratesTv/main/combined_playlist.m3u"
];

// CLEAN NAME
function cleanName(n){
return n
.replace(/\[.*?\]/g,'')
.replace(/\(.*?\)/g,'')
.replace(/\|/g,' ')
.replace(/-/g,' ')
.replace(/\s+/g,' ')
.trim();
}

// CATEGORY DETECT
function category(n){
n=n.toLowerCase();
if(n.includes("news"))return "news";
if(n.includes("sport"))return "sports";
if(n.includes("movie"))return "movies";
if(n.includes("kids"))return "kids";
if(n.includes("music"))return "music";
return "other";
}

// LANGUAGE DETECT
function language(n){
n=n.toLowerCase();
if(n.includes("bangla")||n.includes("bd"))return "bangla";
if(n.includes("hindi")||n.includes("india"))return "hindi";
if(n.includes("english"))return "english";
return "unknown";
}

// COUNTRY DETECT
function country(n){
n=n.toLowerCase();
if(n.includes("bd")||n.includes("bangladesh"))return "bangladesh";
if(n.includes("india")||n.includes("in"))return "india";
return "global";
}

// PARSER
let loaded=0;

sources.forEach(url=>{

fetch(url)
.then(r=>r.text())
.then(data=>parseM3U(data))
.catch(()=>{})
.finally(()=>{

loaded++;
if(loaded===sources.length){

rawChannels = dedupe(rawChannels);
current = rawChannels;
render();

}

});

});

function parseM3U(data){

let lines=data.split("\n");
let name="";

lines.forEach(l=>{

l=l.trim();

if(l.startsWith("#EXTINF")){
name = cleanName(l.split(",")[1]||"Channel");
}

else if(l.startsWith("http")){
rawChannels.push({
name:name,
url:l,
category:category(name),
language:language(name),
country:country(name)
});
}

});

}

// REMOVE DUPLICATE
function dedupe(arr){
let map={};
return arr.filter(c=>{
if(map[c.url]) return false;
map[c.url]=1;
return true;
});
}

let current=[];

// FILTER SYSTEM
function setFilter(type,value){

if(value==="all"){
current=rawChannels;
}
else{
current=rawChannels.filter(c=>c[type]===value);
}

render();
}

// SEARCH + RENDER
function render(){

let list=document.getElementById("list");
let s=document.getElementById("search").value.toLowerCase();

list.innerHTML="";

current
.filter(c=>c.name.toLowerCase().includes(s))
.slice(0,300)
.forEach(ch=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
${ch.name}<br>
<small>${ch.category} | ${ch.language} | ${ch.country}</small>
`;

div.onclick=()=>play(ch.url);

list.appendChild(div);

});

}

// PLAY
function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}

}

</script>

</body>
</html>
