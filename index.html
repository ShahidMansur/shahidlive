<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV PRO DASHBOARD</title>

<style>
body{
margin:0;
background:#0a0a0a;
color:#fff;
font-family:Arial;
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#111;
padding:10px;
overflow-y:auto;
}

.brand{
color:red;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
border-radius:6px;
cursor:pointer;
}

.cat:hover{
background:red;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

header{
padding:10px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
}

input{
padding:6px;
border-radius:6px;
border:none;
width:200px;
}

.content{
display:flex;
flex:1;
}

.list{
width:40%;
overflow-y:auto;
padding:10px;
border-right:1px solid #222;
}

.card{
background:#1a1a1a;
padding:10px;
margin:5px 0;
border-radius:6px;
cursor:pointer;
}

.card:hover{
background:#333;
}

.player{
flex:1;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:95%;
max-width:800px;
background:black;
border-radius:10px;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="brand">📺 IPTV PRO</div>

<div class="cat" onclick="loadCategory('all')">All</div>
<div class="cat" onclick="loadCategory('news')">News</div>
<div class="cat" onclick="loadCategory('sports')">Sports</div>
<div class="cat" onclick="loadCategory('movies')">Movies</div>
<div class="cat" onclick="loadCategory('kids')">Kids</div>
<div class="cat" onclick="loadCategory('music')">Music</div>
<div class="cat" onclick="loadCategory('religious')">Religious</div>
<div class="cat" onclick="loadCategory('documentary')">Documentary</div>

</div>

<div class="main">

<header>
<div>PRO DASHBOARD</div>
<input id="search" placeholder="Search..." onkeyup="render()">
</header>

<div class="content">

<div class="list" id="list"></div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

let video = document.getElementById("video");
let allChannels = [];
let current = [];

let playlistUrl = "https://iptv-org.github.io/iptv/index.m3u";

// 🔥 LOAD IPTV ORG M3U
fetch(playlistUrl)
.then(r=>r.text())
.then(data=>{

let lines = data.split("\n");
let name="";

lines.forEach(line=>{

if(line.startsWith("#EXTINF")){
name = line.split(",")[1];
}

else if(line.startsWith("http")){
allChannels.push({
name:name,
url:line,
type:guessType(name)
});
}

});

current = allChannels;
render();

});

function guessType(name){

name = name.toLowerCase();

if(name.includes("news")) return "news";
if(name.includes("sport")) return "sports";
if(name.includes("movie")) return "movies";
if(name.includes("kids")) return "kids";
if(name.includes("music")) return "music";
if(name.includes("relig")) return "religious";
if(name.includes("doc")) return "documentary";

return "other";
}

function render(){

let list = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

list.innerHTML="";

current
.filter(c=>c.name.toLowerCase().includes(search))
.forEach(ch=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${ch.name}</b><br>
<small>${ch.type}</small>
`;

div.onclick=()=>play(ch.url);

list.appendChild(div);

});

}

function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src=url;
}

}

function loadCategory(type){

if(type=="all"){
current = allChannels;
}else{
current = allChannels.filter(c=>c.type==type);
}

render();

}

</script>

</body>
</html>
