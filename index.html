<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM LIVE ZONE FINAL CORE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
display:flex;
background:#000;
color:#fff;
font-family:Arial;
overflow:hidden;
}

.sidebar{
width:240px;
background:#111;
padding:10px;
overflow-y:auto;
}

.logo{
color:red;
font-weight:bold;
font-size:18px;
margin-bottom:10px;
}

.cat{
padding:8px;
margin:5px 0;
background:#1a1a1a;
border-radius:6px;
cursor:pointer;
font-size:13px;
}
.cat:hover{background:#ff0000}

.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
}

input{
width:230px;
padding:6px;
border:none;
border-radius:6px;
}

.player{
height:42%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:95%;
max-width:900px;
aspect-ratio:16/9;
border-radius:10px;
}

.list{
height:58%;
overflow-y:auto;
background:#0f0f0f;
padding:10px;

display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:10px;
}

.card{
background:#1a1a1a;
padding:10px;
border-radius:8px;
cursor:pointer;
text-align:center;
font-size:12px;
}
.card:hover{
background:#333;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">📺 SM LIVE ZONE CORE</div>

<h4>📂 Category</h4>
<div class="cat" onclick="filter('category','all')">All</div>
<div class="cat" onclick="filter('category','sports')">Sports</div>
<div class="cat" onclick="filter('category','news')">News</div>
<div class="cat" onclick="filter('category','kids')">Kids</div>
<div class="cat" onclick="filter('category','movies')">Movies</div>

<h4>🌐 Language</h4>
<div class="cat" onclick="filter('language','bangla')">Bangla</div>
<div class="cat" onclick="filter('language','hindi')">Hindi</div>
<div class="cat" onclick="filter('language','english')">English</div>

<h4>🌍 Country</h4>
<div class="cat" onclick="filter('country','bangladesh')">Bangladesh</div>
<div class="cat" onclick="filter('country','india')">India</div>
<div class="cat" onclick="filter('country','global')">Global</div>

<div class="cat" onclick="filter('worldcup','yes')">🏆 World Cup Hub</div>

</div>

<div class="main">

<div class="topbar">
<input id="search" placeholder="Search channels..." onkeyup="render()">
<div>SM LIVE CORE ✔</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js"></script>

<script>

let video=document.getElementById("video");

let sources=[
"https://iptvflixbd.github.io/mrgifytv",
"https://iptv-org.github.io/iptv/index.m3u",
"https://raw.githubusercontent.com/FunctionError/PiratesTv/main/combined_playlist.m3u",
"https://raw.githubusercontent.com/FunctionError/PiratesTvPlus/main/PiratesPlus.m3u"
];

let all=[];

// CLEAN NAME
function clean(n){
return n
.replace(/\[.*?\]/g,'')
.replace(/\(.*?\)/g,'')
.replace(/\|/g,' ')
.replace(/-/g,' ')
.replace(/\s+/g,' ')
.trim();
}

// CATEGORY (ONLY 5)
function category(n){
n=n.toLowerCase();
if(n.includes("sport"))return "sports";
if(n.includes("news"))return "news";
if(n.includes("kids"))return "kids";
if(n.includes("movie"))return "movies";
return "other";
}

// LANGUAGE
function language(n){
n=n.toLowerCase();
if(n.includes("bangla")||n.includes("bd"))return "bangla";
if(n.includes("hindi")||n.includes("india"))return "hindi";
return "english";
}

// COUNTRY + BD PRIORITY TAG
function country(n){
n=n.toLowerCase();

if(
n.includes("bd")||
n.includes("bangladesh")||
n.includes("btv")||
n.includes("somoy")||
n.includes("t sports")||
n.includes("channel i")
) return "bangladesh";

if(n.includes("india")||n.includes("in"))return "india";

return "global";
}

// WORLD CUP TAG
function worldcup(n){
n=n.toLowerCase();
return (n.includes("sport") || n.includes("cricket")) ? "yes":"no";
}

let loaded=0;

sources.forEach(url=>{

fetch(url)
.then(r=>r.text())
.then(data=>parse(data))
.catch(()=>{})
.finally(()=>{

loaded++;
if(loaded===sources.length){

all = dedupe(all);

// BD PRIORITY TOP
all.sort((a,b)=>{
if(a.country==="bangladesh" && b.country!=="bangladesh") return -1;
if(a.country!=="bangladesh" && b.country==="bangladesh") return 1;
return 0;
});

current=all;
render();
}

});

});

function parse(data){

let lines=data.split("\n");
let name="";

lines.forEach(l=>{

l=l.trim();

if(l.startsWith("#EXTINF")){
name=clean(l.split(",")[1]||"Channel");
}

else if(l.startsWith("http")){
all.push({
name:name,
url:l,
category:category(name),
language:language(name),
country:country(name),
worldcup:worldcup(name)
});
}

});

}

// DEDUPE (NO LOSS)
function dedupe(arr){
let map={};
return arr.filter(c=>{
if(map[c.url])return false;
map[c.url]=1;
return true;
});
}

let current=[];

// FILTER ENGINE (FIXED)
function filter(type,value){

if(value==="all"){
current=all;
}
else{
current=all.filter(c=>c[type]===value);
}

render();
}

// RENDER (NO LIMIT BUG FIXED)
function render(){

let list=document.getElementById("list");
let s=document.getElementById("search").value.toLowerCase();

list.innerHTML="";

current
.filter(c=>c.name.toLowerCase().includes(s))
.forEach(ch=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
${ch.name}<br>
<small>${ch.country} | ${ch.language} | ${ch.category}</small>
`;

div.onclick=()=>play(ch.url);

list.appendChild(div);

});

}

// PLAY FIXED
function play(url){

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}

}

</script>

</body>
</html>
