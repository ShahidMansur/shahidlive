name: Auto Update IPTV Channels

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর নিজে থেকে চলবে
  workflow_dispatch: # আপনি চাইলে গিটহাব থেকে বাটনে ক্লিক করেও চালাতে পারবেন

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Updater Script
        run: node updater.js

      - name: Commit and Push Active Channels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git commit -m "Auto-updated active channels list" || exit 0
          git push
